<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>PulseNews</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./styles.css" />
	</head>
	<body>
		<div class="bg" aria-hidden="true"></div>

		<header class="header">
			<div class="header__inner">
				<div class="brand">
					<div class="brand__mark" aria-hidden="true"></div>
					<div>
						<div class="brand__name">News</div>
						<div class="brand__sub">
							<span id="statusText">Fetching latest stories…</span>
							<span class="dot" aria-hidden="true">•</span>
							<span id="updatedText">—</span>
						</div>
					</div>
				</div>

				<div class="header__actions">
					<button id="refreshBtn" class="btn btn--ghost" type="button">
						Refresh
					</button>
				</div>
			</div>

			<nav class="tabs" aria-label="Categories">
				<div id="tabs" class="tabs__row" role="tablist"></div>
			</nav>
		</header>

		<main class="main">
			<section class="controls">
				<div id="metaLine" class="metaLine" aria-live="polite"></div>
			</section>

			<section class="feed" aria-live="polite" aria-busy="true">
				<div id="cards" class="grid"></div>
			</section>

			<section class="footer">
				<div id="errorBox" class="errorBox" hidden>
					<div class="errorBox__title">Couldn’t load news</div>
					<div id="errorMsg" class="errorBox__msg"></div>
					<div class="errorBox__actions">
						<button id="retryBtn" class="btn btn--primary" type="button">
							Retry
						</button>
					</div>
				</div>

				<button id="loadMoreBtn" class="btn btn--primary" type="button" hidden>
					Load more
				</button>
			</section>
		</main>

		<template id="cardTpl">
			<article class="card">
				<a class="card__link" target="_blank" rel="noopener noreferrer">
					<div class="card__media">
						<img class="card__img" alt="" loading="lazy" />
						<div class="card__imgFallback" aria-hidden="true"></div>
					</div>
					<div class="card__body">
						<div class="card__meta">
							<span class="chip chip--source"></span>
							<span class="chip chip--date"></span>
						</div>
						<h2 class="card__title"></h2>
						<p class="card__desc"></p>
					</div>
				</a>
			</article>
		</template>

		<template id="skeletonTpl">
			<article class="card card--skeleton" aria-hidden="true">
				<div class="card__media">
					<div class="sk sk--img"></div>
				</div>
				<div class="card__body">
					<div class="sk sk--line"></div>
					<div class="sk sk--line sk--line2"></div>
					<div class="sk sk--line sk--line3"></div>
				</div>
			</article>
		</template>

		<script type="module" src="./app.js"></script>
	</body>
</html>
