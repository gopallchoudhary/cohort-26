<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Checkboxes</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
				font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
				min-height: 100vh;
				padding: 40px 20px;
				color: #e0e0e0;
			}

			h1 {
				text-align: center;
				color: #00d4ff;
				font-size: 3rem;
				margin-bottom: 40px;
				text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
				letter-spacing: 2px;
				animation: fadeIn 0.8s ease-in;
			}

			.container {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(40px, 1fr));
				gap: 15px;
				max-width: 1200px;
				margin: 0 auto;
				padding: 30px;
				background: rgba(255, 255, 255, 0.05);
				border-radius: 15px;
				backdrop-filter: blur(10px);
				border: 1px solid rgba(0, 212, 255, 0.2);
				box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
			}

			input[type="checkbox"] {
				width: 30px;
				height: 30px;
				cursor: pointer;
				accent-color: #00d4ff;
				transition: all 0.3s ease;
				border-radius: 4px;
			}

			input[type="checkbox"]:hover {
				transform: scale(1.2);
				box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
			}

			input[type="checkbox"]:checked {
				box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
				animation: pulse 0.5s ease;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(-20px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			@keyframes pulse {
				0%,
				100% {
					box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
				}
				50% {
					box-shadow: 0 0 30px rgba(0, 212, 255, 1);
				}
			}

			.error-alert {
				position: fixed;
				top: 20px;
				right: 20px;
				background: #ff4444;
				color: white;
				padding: 15px 20px;
				border-radius: 8px;
				box-shadow: 0 4px 12px rgba(255, 68, 68, 0.3);
				max-width: 400px;
				word-wrap: break-word;
				animation: slideIn 0.3s ease-out;
				z-index: 1000;
			}

			.error-alert.fade-out {
				animation: fadeOut 0.3s ease-out forwards;
			}

			@keyframes slideIn {
				from {
					transform: translateX(400px);
					opacity: 0;
				}
				to {
					transform: translateX(0);
					opacity: 1;
				}
			}

			@keyframes fadeOut {
				from {
					opacity: 1;
				}
				to {
					opacity: 0;
				}
			}

			@media (max-width: 768px) {
				h1 {
					font-size: 2rem;
					margin-bottom: 30px;
				}

				.container {
					grid-template-columns: repeat(auto-fit, minmax(35px, 1fr));
					gap: 12px;
					padding: 20px;
				}

				input[type="checkbox"] {
					width: 25px;
					height: 25px;
				}

				.error-alert {
					top: 10px;
					right: 10px;
					max-width: 90vw;
				}
			}
		</style>
	</head>
	<body>
		<h1>Checkboxes</h1>
		<div class="container"></div>

		<script src="/socket.io/socket.io.js"></script>
		<script>
			const container = document.querySelector(".container");
			const count = 200;
			const socket = io();

			function showErrorAlert(message) {
				console.log("Showing error alert:", message);
				const alert = document.createElement("div");
				alert.className = "error-alert";
				alert.textContent = String(message);
				document.body.appendChild(alert);
				console.log("Alert element added to DOM");

				setTimeout(() => {
					alert.classList.add("fade-out");
					setTimeout(() => alert.remove(), 300);
				}, 4000);
			}

			

			socket.on("error", (error) => {
				console.error("Socket error:", error);
				showErrorAlert("Error: " + String(error));
			});

			socket.on("server-error", (data) => {
				console.log("Server-error event received:", data);
				const errorMessage = data?.error || data || "Unknown error";
				if (errorMessage) {
					console.log("Displaying error message:", errorMessage);
					showErrorAlert(errorMessage);
				} else {
					console.warn("No error message in data");
				}
			});

			socket.on("server:checkbox:change", (message) => {
				const { index, checked } = message;
				const input = document.getElementById(`checkbox-#${index}`);

				if (input) {
					input.checked = checked;
				}
			});

			window.addEventListener("load", async () => {
				const response = await fetch("/checkboxes", { method: "GET" });
				const data = await response.json();

				if (data && data.checkboxes) {
					data.checkboxes.forEach((serverValue, index) => {
						const input = document.createElement("input");
						input.type = "checkbox";
						input.id = `checkbox-#${index}`;
						input.checked = serverValue;

						input.addEventListener("change", (event) => {
							const checked = event.target.checked;
							socket.emit("client:checkbox:change", { index, checked });
						});

						container.appendChild(input);
					});
				}
			});
		</script>
	</body>
</html>
